          try { return JSON.parse(saved); } catch(e) {}
        }
        return DEFAULT_TEACHER_ALLOCATION;
      });

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('bird_island_textbook_records');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) { return []; }
        }
        return [];
      });

      const [availableSubjects, setAvailableSubjects] = useState([]);

      // ★ 初始化分數直接為 5
      function getInitialFormData() {
        const initialScores = Array(CRITERIA.length).fill(null).map(() => Array(PUBLISHERS.length).fill(5));
        return {
          grade: "", subject: "", reviewers: "", decision: "keep", changedPublisher: "", seriesName: "", reason: "", scores: initialScores
        };
      }

      useEffect(() => {
        localStorage.setItem('bird_island_textbook_records', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('bird_island_allocation', JSON.stringify(allocationData));
      }, [allocationData]);

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (error) {
            console.error("Firebase 登入失敗", error);
            showToast(`Firebase認證失敗 (${error.code})，請確認是否啟用匿名登入！`);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return; 
        try {
          if (Object.keys(firebaseConfig).length === 0) return;
          
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'textbookReviews');
          const unsubscribeRecords = onSnapshot(colRef, (snapshot) => {
            const fetchedRecords = snapshot.docs.map(doc => {
              const data = doc.data();
              let parsedScores = data.scores;
              if (typeof data.scores === 'string') {
                try { parsedScores = JSON.parse(data.scores); } catch (e) {}
              }
              return { id: doc.id, ...data, scores: parsedScores };
            });
            fetchedRecords.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setRecords(fetchedRecords);
          }, (error) => {
            console.error("雲端資料讀取失敗", error);
          });

          const allocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'allocationTable');
          const unsubscribeAlloc = onSnapshot(allocRef, (docSnap) => {
            if (docSnap.exists()) {
              setAllocationData(docSnap.data().data);
            }
          }, (error) => console.error("雲端分配表讀取失敗", error));

          return () => { unsubscribeRecords(); unsubscribeAlloc(); };
        } catch(err) {
          console.error("Firebase未正確設定", err);
        }

        if (formData.grade) {
          setAvailableSubjects(formData.grade === "一年級" || formData.grade === "二年級" ? SUBJECTS_LOW : SUBJECTS_HIGH);

          setAvailableSubjects([]);

        const url = window.location.href;
        const textField = document.createElement('textarea');
        textField.innerText = url;
        document.body.appendChild(textField);
        textField.select();
        document.execCommand('copy');
        textField.remove();
        showToast("系統網址已複製！");
      };

      const getPrevVersion = (grade, subject) => PREV_VERSIONS[`${grade}_${subject}`] || "無資料";

      const handleScoreChange = (cIdx, pIdx, value) => {
        const newScores = [...formData.scores];
        newScores[cIdx] = [...newScores[cIdx]];
        newScores[cIdx][pIdx] = parseInt(value, 10);
        setFormData({ ...formData, scores: newScores });
      };

      const calculateTotal = (scores, pIdx) => scores.reduce((sum, row) => sum + (row[pIdx] || 0), 0);

      const calculateRanks = (scores) => {
        const totals = PUBLISHERS.map((_, idx) => calculateTotal(scores, idx));
        const sortedTotals = [...totals].sort((a, b) => b - a);
        return totals.map(t => sortedTotals.indexOf(t) + 1);
      };

      const isEnglishSubject = formData.subject === "語文領域英語文" || formData.subject === "彈性課程望潮英創客";

      const allTeachersList = useMemo(() => {
        const teacherSet = new Set();
        Object.values(allocationData).forEach(gradeObj => {
          Object.values(gradeObj).forEach(names => {
            if(names) {
              names.split(/、|,/).forEach(name => {
                const trimmed = name.trim();
                if(trimmed) teacherSet.add(trimmed);
              });
            }
          });
        });
        return Array.from(teacherSet).sort();
      }, [allocationData]);

      const teacherTasks = useMemo(() => {
        if (!selectedTeacherForChecklist) return [];
        const tasks = [];
        Object.entries(allocationData).forEach(([grade, gradeObj]) => {
          Object.entries(gradeObj).forEach(([subject, names]) => {
            if (names && names.includes(selectedTeacherForChecklist)) {
              const isCompleted = records.some(r => r.grade === grade && r.subject === subject);
              tasks.push({ grade, subject, isCompleted, reviewers: names });
            }
          });
        });
        return tasks.sort((a, b) => (a.isCompleted === b.isCompleted ? 0 : a.isCompleted ? 1 : -1));
      }, [selectedTeacherForChecklist, allocationData, records]);


      const handleAdminToggle = () => {
        if (isAdmin) {
          setIsAdmin(false);
          setIsEditingTable(false);
          showToast("已鎖定並登出管理員模式");
        } else {
          const pwd = window.prompt("請輸入管理員密碼：");
          if (pwd === ADMIN_PASSWORD) {
            setIsAdmin(true);
            showToast("密碼正確！已解鎖管理權限");
          } else if (pwd !== null) {
            alert("密碼錯誤，拒絕存取！");
          }
        }
      };

      const handleAllocationChange = (grade, subject, value) => {
        setAllocationData(prev => ({
          ...prev,
          [grade]: {
            ...prev[grade],
            [subject]: value
          }
        }));
      };

      const saveAllocationTable = async () => {
        try {
          if (user && Object.keys(firebaseConfig).length > 0) {
            const allocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'allocationTable');
            await updateDoc(allocRef, { data: allocationData }).catch(async (e) => {
              await setDoc(allocRef, { data: allocationData });
            });
            showToast("分配表已成功同步至雲端！");
          } else {
            showToast("分配表已儲存至本機！");
          }
          setIsEditingTable(false);
        } catch (error) {
          console.error("分配表儲存失敗", error);
          showToast(`儲存失敗：${error.code || error.message}，請檢查規則`, true);
        }
      };

      const handleSubmit = async () => {
        if (!formData.grade || !formData.subject) return showToast("請選擇年級與科目！", true);
        if (formData.decision === 'change' && (!formData.changedPublisher || !formData.reason)) return showToast("若選擇改用，請選擇新版本並填寫原因！", true);
        if (isEnglishSubject && !formData.seriesName.trim()) return showToast("請填寫英語教材特定系列名稱（例如：Hooray）！", true);

        const prevVersion = getPrevVersion(formData.grade, formData.subject);
        let finalPublisher = formData.decision === 'keep' ? prevVersion : formData.changedPublisher;
        if (isEnglishSubject && formData.seriesName.trim()) finalPublisher += ` - ${formData.seriesName.trim()}`;
        
        const d = new Date();
        const autoTwDate = `${d.getFullYear() - 1911}年${d.getMonth() + 1}月${d.getDate()}日`;
        const submitDate = MEETING_DATE !== "" ? MEETING_DATE : autoTwDate;

        const { scores, ...otherFormData } = formData;
        const baseData = {
          ...otherFormData,
          date: submitDate,
          prevVersion,
          finalPublisher,
          timestamp: Date.now()
        };

        const firestoreData = { ...baseData, scores: JSON.stringify(scores) };
        const localData = { ...baseData, scores: scores };

        setIsSaving(true);
        try {
          if (user && Object.keys(firebaseConfig).length > 0) {
            if (editingId) {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'textbookReviews', editingId);
              await updateDoc(docRef, firestoreData);
              showToast("紀錄表已成功更新！");
            } else {
              const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'textbookReviews');
              await addDoc(colRef, firestoreData);
              showToast("紀錄表已成功新增至雲端！");
            }
          } else {
            if (editingId) {
               setRecords(records.map(r => r.id === editingId ? { ...localData, id: editingId } : r));
               showToast("已更新至本機備份 (未連線雲端)");
            } else {
               setRecords([{ ...localData, id: Date.now() }, ...records]);
               showToast("已存入本機備份 (未連線雲端)");
            }
          }
          
          setFormData(getInitialFormData());
          setEditingId(null);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setActiveTab('list');
        } catch (error) {
          console.error("儲存失敗", error);
          // 顯示具體錯誤代碼，幫助除錯
          showToast(`儲存失敗：${error.code || error.message}，暫存至瀏覽器！`, true);
          
          // 就算雲端失敗，還是先把它塞進 LocalStorage 以防資料遺失
          if (editingId) {
             setRecords(records.map(r => r.id === editingId ? { ...localData, id: editingId } : r));
          } else {
             setRecords([{ ...localData, id: Date.now() }, ...records]);
          }
          setFormData(getInitialFormData());
          setEditingId(null);
          setActiveTab('list');
        }
        setIsSaving(false);
      };

      const handleEdit = (record) => {
        setFormData({
          grade: record.grade,
          subject: record.subject,
          reviewers: record.reviewers,
          decision: record.decision,
          changedPublisher: record.changedPublisher || "",
          seriesName: record.seriesName || "",
          reason: record.reason || "",
          scores: record.scores

        setEditingId(record.id);
        setActiveTab('form');
        window.scrollTo({ top: 0, behavior: 'smooth' });

            if (user && Object.keys(firebaseConfig).length > 0) {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'textbookReviews', id));
              showToast("已從雲端刪除！");
            } else {
              setRecords(records.filter(r => r.id !== id));
              showToast("已從本機移除！");
            }
          } catch (error) {
            console.error("刪除失敗", error);
            showToast(`刪除失敗：${error.code || error.message}`, true);
          }
        }
      };

              </div>

                <div>
                  <span style="display:inline-block; width:16px; height:16px; border:1px solid black; margin-right:8px; text-align:center; line-height:16px; font-size:14px; font-weight:bold; vertical-align:middle;">
                    ${record.decision === 'keep' ? '✓' : '&nbsp;'}
                  </span>
                  教科書沿用前學年度 <span style="display:inline-block; border-bottom:1px solid black; min-width:120px; text-align:center; padding:0 10px;">${keepText}</span> 版本。

            <div class="html2pdf__page-break"></div>

            <div style="margin-top: 20px; padding-top: 20px;">

                  </tr>
                  <tr>
                    ${PUBLISHERS.map(pub => `<th style="border: 1px solid black; padding: 8px; text-align: center;">${pub}</th>`).join('')}
                  </tr>
                  <tr style="font-size: 10pt; font-weight: normal;">
                    <th style="border: 1px solid black; padding: 8px;"></th>
                    ${PUBLISHERS.map(() => `<th style="border: 1px solid black; padding: 8px; text-align: center;">極佳 5 佳 4 尚可 3 差 2 極差 1</th>`).join('')}

                </thead>
                <tbody>
                  ${CRITERIA.map((criterion, cIdx) => `
                    <tr>
                      <td style="border: 1px solid black; padding: 8px;">${criterion}</td>
                      ${PUBLISHERS.map((pub, pIdx) => `<td style="text-align: center; border: 1px solid black; padding: 8px;">${record.scores[cIdx][pIdx]}</td>`).join('')}
                    </tr>
                  `).join('')}
                  <tr style="font-weight: bold;">
                    <td style="text-align: right; border: 1px solid black; padding: 8px;">總分</td>
                    ${totals.map((t) => `<td style="text-align: center; border: 1px solid black; padding: 8px;">${t}</td>`).join('')}
                  </tr>
                  <tr style="font-weight: bold;">
                    <td style="text-align: right; border: 1px solid black; padding: 8px;">名次（順位）</td>
                    ${ranks.map((rank) => `<td style="text-align: center; border: 1px solid black; padding: 8px;">${rank}</td>`).join('')}
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `;

        const opt = {
          margin:       0,
          filename:     `${record.grade}${record.subject}_審查紀錄表.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
          showToast("PDF 檔案已成功下載！");
        }).catch(err => {
          console.error("PDF 產生失敗", err);
          showToast("PDF 產生失敗，請再試一次。", true);
        });
      };

      const exportToWord = (record) => {
